name: Python CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        run: pytest

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/python-web:${IMAGE_TAG} .

      - name: Push versioned image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/python-web:${IMAGE_TAG}

      - name: Tag latest
        run: docker tag ${{ secrets.DOCKERHUB_USERNAME }}/python-web:${IMAGE_TAG} ${{ secrets.DOCKERHUB_USERNAME }}/python-web:latest

      - name: Push latest
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/python-web:latest